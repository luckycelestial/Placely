name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "all" ]
  pull_request:
    branches: [ "main", "master", "all" ]

jobs:
  validate:
    name: Type Check, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:54322/postgres"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci"
      SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci"
      JWT_SECRET: "dummy-jwt-secret-for-ci-testing-purposes-32-chars"
      APP_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      - name: Verify Migration Status
        run: npx prisma migrate status

      - name: Run Test Suite
        run: npm test

      - name: Production Build Verification
        run: npm run build
